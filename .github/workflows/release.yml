name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Update npm for trusted publishing
        run: npm install -g npm@11
      - name: Check the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
      - name: Read the release notes from the changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
