name: Publish

on:
  push:
    tags: ['v*']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(node -p "require('./package.json').version")"
          npm run build
          built="$(node --input-type=module -e "import('./dist/index.js').then((m) => console.log(m.VERSION))")"
          echo "tag $tag, package.json $declared, module $built"
          test "$tag" = "$declared"
          test "$tag" = "$built"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Take the notes from the changelog
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { found = ($2 == version); next }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
